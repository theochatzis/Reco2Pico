# ============================================================
# Z+jet windowed response + eta-binned jet composition
# ============================================================

Z_mass:
  title: "Z mass;m_{#mu#mu} [GeV];Events"
  bins: [80, 80, 102]
  variable: "Z_mass"
  weight: "zjet_eventWeight"

Z_pt:
  title: "Z p_{T};p_{T}^{Z} [GeV];Events"
  bins: [40, 0, 200]
  variable: "Z_pt"
  weight: "zjet_eventWeight"

MPF_nominal:
  title: "Nominal event MPF;MPF;Events"
  bins: [160, -1, 3]
  variable: "MPF_nominal"
  weight: "zjet_eventWeight"

DB_nominal_vs_Zpt:
  type: "TProfile"
  title: "Nominal Direct Balance;p_{T}^{Z} [GeV];DB"
  bins: [100, 0, 500]
  variable_x: "Z_pt"
  variable_y: "DB_nominal"
  weight: "zjet_eventWeight"

MPF_nominal_vs_Zpt:
  type: "TProfile"
  title: "Nominal MPF;p_{T}^{Z} [GeV];MPF"
  bins: [100, 0, 500]
  variable_x: "Z_pt"
  variable_y: "MPF_nominal"
  weight: "zjet_eventWeight"

# ============================================================
# PARALLEL / SIGNAL
# ============================================================

Jet_eta_parallel:
  title: "Jet #eta, parallel / signal;#eta^{jet};Weighted jets"
  bins: [100, -5, 5]
  variable: "Jet_eta_parallel"
  weight: "weight_parallel"

DB_parallel:
  title: "Direct balance, parallel / signal;p_{T}^{jet}/p_{T}^{Z};Weighted jets"
  bins: [120, 0, 2.4]
  variable: "DB_parallel"
  weight: "weight_parallel"

MPF_parallel:
  title: "MPF, parallel / signal;MPF;Weighted jets"
  bins: [160, -1, 3]
  variable: "MPF_parallel"
  weight: "weight_parallel"

DB_parallel_vs_Zpt:
  type: "TProfile"
  title: "Direct balance, parallel / signal;p_{T}^{Z} [GeV];DB"
  bins: [40, 0, 200]
  variable_x: "Z_pt_parallel"
  variable_y: "DB_parallel"
  weight: "weight_parallel"

MPF_parallel_vs_Zpt:
  type: "TProfile"
  title: "MPF, parallel / signal;p_{T}^{Z} [GeV];MPF"
  bins: [40, 0, 200]
  variable_x: "Z_pt_parallel"
  variable_y: "MPF_parallel"
  weight: "weight_parallel"

# ============================================================
# TRANSVERSE CONTROL
# ============================================================

Jet_eta_transverse:
  title: "Jet #eta, transverse control;#eta^{jet};Weighted jets"
  bins: [100, -5, 5]
